<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>האביט טראקר — תצוגה מקדימה</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Gveret+Levin+AlefAlefAlef&display=swap" rel="stylesheet" />
<style>
/* ==========================================================================
   styles.css — אוף־וייט ודיו. הטבלה מציירת את המשבצות שלה בעצמה,
   כדי שכל איקס יישב בדיוק מתחת לנושא שלו בכל רמת זום.
   ========================================================================== */

:root {
  --paper: #F4F5F6;         /* אוף־וייט קריר */
  --card: #FCFCFD;
  --rule: #DFE4E9;
  --rule-strong: #C3CCD4;
  --ink: #17212B;
  --ink-soft: #5C6B78;
  --pen: #2B4C8C;
  --pen-green: #1F6B4A;
  --pen-red: #B3271E;
  --band: #17212B;
  --band-text: #FFFFFF;
  --tint: rgba(43, 76, 140, .05);
  --row: 30px;
  --col: 34px;
  --radius: 4px;
}

[data-theme="dark"] {
  --paper: #12171C;
  --card: #171E25;
  --rule: #29323B;
  --rule-strong: #3C4855;
  --ink: #E6ECF1;
  --ink-soft: #94A2AF;
  --pen: #7FA8E8;
  --pen-green: #5FC79A;
  --pen-red: #E8827A;
  --band: #0C1116;
  --band-text: #E6ECF1;
  --tint: rgba(127, 168, 232, .07);
}

* { box-sizing: border-box; }

html { background: var(--paper); }

body {
  margin: 0;
  font-family: "Heebo", system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--paper);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

input, button { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.brand {
  font-family: "Gveret Levin AlefAlefAlef", "Heebo", sans-serif;
  font-weight: 400;
  letter-spacing: .01em;
  margin: 0;
}
.brand.big { font-size: 42px; line-height: 1.05; }
.brand.sm { font-size: 24px; }

.boot { padding: 60px 20px; text-align: center; color: var(--ink-soft); }

/* ---------- כניסה ---------- */

.login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.login-card {
  width: min(380px, 100%);
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 30px 26px 26px;
  box-shadow: 0 10px 30px rgba(23, 33, 43, .07);
}
.logo {
  font-family: "Instrument Serif", Georgia, serif;
  font-weight: 400; font-size: 64px; line-height: 1;
  margin: 6px 0 0; text-align: center; letter-spacing: .01em;
}
.login-sub { margin: 10px 0 28px; color: var(--ink-soft); font-size: 15px; text-align: center; }

.field { display: block; margin-bottom: 16px; }
.field > span { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
.field input {
  width: 100%; padding: 11px 12px;
  border: 1px solid var(--rule-strong);
  border-radius: var(--radius);
  background: var(--card);
}
.field input:focus { border-color: var(--pen); outline: none; }
.login-error { color: var(--pen-red); font-size: 14px; margin: 0 0 14px; }

.btn {
  border: 1px solid var(--rule-strong);
  background: var(--card);
  border-radius: var(--radius);
  padding: 10px 16px;
  display: inline-flex; align-items: center; gap: 8px;
}
.btn.primary {
  width: 100%; justify-content: center;
  background: var(--band); border-color: var(--band); color: var(--band-text);
  padding: 12px;
}
.btn.primary:disabled { opacity: .55; }
.btn.ghost { background: transparent; border-color: var(--rule); color: var(--ink-soft); }
.btn.wide { width: 100%; justify-content: center; }

.ghost {
  background: none; border: none; color: var(--ink-soft);
  padding: 4px 10px; font-size: 22px; line-height: 1; border-radius: var(--radius);
}
.ghost:disabled { opacity: .3; }
.ghost.sm { font-size: 15px; padding: 4px 7px; }
.ghost.danger { color: var(--pen-red); }
.ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }

/* ---------- באנר עליון ---------- */

.topbar {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  background: var(--band);
  color: var(--band-text);
  padding: 12px 16px;
  min-height: 56px;
}
.topbar .brand { color: var(--band-text); display: flex; align-items: baseline; gap: 7px; }
.brand-log { font-family: "Instrument Serif", Georgia, serif; font-size: 30px; line-height: 1; }
.brand-rest { font-family: "Heebo", sans-serif; font-size: 15px; letter-spacing: .02em; opacity: .8; }
.brand.sm { display: flex; align-items: baseline; gap: 6px; }
.brand.sm .brand-log { font-size: 24px; }
.brand.sm .brand-rest { font-size: 13px; }
.topbar-actions {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  display: flex; align-items: center; gap: 2px;
}
.topbar-actions button {
  background: none; border: none; color: var(--band-text);
  padding: 8px; border-radius: var(--radius); display: flex;
}
.topbar-actions button:active { background: rgba(255, 255, 255, .14); }

/* ---------- לשוניות עליונות ---------- */

.segments { display: flex; border-bottom: 1px solid var(--rule); background: var(--card); }
.segments button {
  flex: 1; background: none; border: none; padding: 12px 4px;
  color: var(--ink-soft); font-size: 15px;
}
.segments button.on { color: var(--ink); box-shadow: inset 0 -2.5px 0 var(--ink); }

.phone-month { padding: 10px 12px 4px; display: flex; align-items: center; gap: 10px; }
.phone-month .monthnav { flex: 1; min-width: 0; }

/* ---------- ניווט חודש ---------- */

.monthnav { display: flex; align-items: center; gap: 4px; }
.month-title {
  font-family: "Gveret Levin AlefAlefAlef", "Heebo", sans-serif;
  font-size: 30px; font-weight: 400; margin: 0; flex: 1; text-align: start;
}
.status { font-size: 12px; color: var(--ink-soft); }
.status.saving { color: var(--pen); }
.status.error { color: var(--pen-red); }

/* ---------- טבלה ---------- */

.grid { border: 1px solid var(--rule-strong); background: var(--card); }
.grid.fluid { margin: 0 10px; }

.grid-head { display: flex; align-items: flex-end; border-bottom: 1.5px solid var(--ink); }

.corner { width: 38px; flex: 0 0 38px; border-inline-start: 1px solid var(--rule); }

.habit-label {
  width: var(--col); flex: 0 0 var(--col);
  height: 100%;
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 6px; overflow: hidden;
  border-inline-start: 1px solid var(--rule);
}
.grid.fluid .habit-label { flex: 1 1 0; width: auto; min-width: 30px; }
.habit-label span {
  writing-mode: vertical-rl; transform: rotate(180deg);
  white-space: nowrap; font-size: 13px; overflow: hidden; text-overflow: ellipsis; max-height: 100%;
}

.numhead {
  width: 44px; flex: 0 0 44px;
  writing-mode: vertical-rl; transform: rotate(180deg);
  font-size: 12px; color: var(--ink-soft);
  align-self: flex-end; padding-bottom: 6px;
  border-inline-start: 1px solid var(--rule);
}

.grid-row { display: flex; align-items: stretch; border-bottom: 1px solid var(--rule); }
.grid-row:last-child { border-bottom: none; }
.grid-row.is-weekend { background: var(--tint); }
.grid-row.is-today { box-shadow: inset 0 0 0 1.5px rgba(179, 39, 30, .4); }

.daycol {
  width: 38px; flex: 0 0 38px;
  background: none; border: none; border-inline-start: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-soft); padding: 0;
}
.daycol b { font-size: 14px; font-weight: 500; color: var(--ink); }
.daycol i { font-size: 10px; font-style: normal; opacity: .7; }
.is-today .daycol b { color: var(--pen-red); font-weight: 700; }

.cell {
  width: var(--col); flex: 0 0 var(--col);
  background: none; border: none;
  border-inline-start: 1px solid var(--rule);
  display: grid; place-items: center; padding: 0;
}
.grid.fluid .cell { flex: 1 1 0; width: auto; min-width: 30px; }
.cell:active { background: var(--tint); }

.x { width: 62%; height: 62%; max-width: 24px; max-height: 24px; fill: none; stroke: var(--pen); stroke-width: 2.2; stroke-linecap: round; }

.numcell {
  width: 44px; flex: 0 0 44px;
  border: none; border-inline-start: 1px solid var(--rule);
  background: transparent; text-align: center;
  font-size: 13px; color: var(--ink-soft); padding: 0; min-width: 0;
}
.numcell:focus { outline: none; background: var(--tint); color: var(--ink); }

/* ---------- רגעים ---------- */

.moments { margin: 0 10px; border: 1px solid var(--rule-strong); background: var(--card); }
.moment-row { display: flex; align-items: center; border-bottom: 1px solid var(--rule); }
.moment-row:last-child { border-bottom: none; }
.moment-row.is-weekend { background: var(--tint); }
.moment-row.is-today { box-shadow: inset 3px 0 0 var(--pen-red); }

.daynum {
  flex: 0 0 40px;
  display: flex; align-items: baseline; justify-content: center; gap: 3px;
  background: none; border: none; border-inline-end: 1px solid var(--rule);
  padding: 0; color: var(--ink-soft); align-self: stretch;
}
.daynum b { font-size: 14px; font-weight: 500; color: var(--ink); }
.daynum i { font-size: 10px; font-style: normal; opacity: .7; }
.daynum.sm { flex: none; width: 36px; border-inline-end: none; border-bottom: 1px solid var(--rule); }
.daynum.is-today b { color: var(--pen-red); font-weight: 700; }

.moment-input {
  flex: 1; min-width: 0; border: none; background: transparent;
  padding: 2px 10px; font-size: 14.5px;
}
.moment-input::placeholder { color: var(--ink-soft); opacity: .55; }
.moment-input:focus { outline: none; background: var(--tint); }

.nextmonth { margin: 16px 10px 0; border-top: 1.5px solid var(--ink); padding-top: 10px; }
.nextmonth label { display: flex; align-items: center; gap: 10px; }
.nextmonth span { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
.nextmonth input {
  flex: 1; min-width: 0; border: none;
  border-bottom: 1px dashed var(--rule-strong);
  background: transparent; padding: 4px 2px; color: var(--pen-red);
}
.nextmonth input:focus { outline: none; border-bottom-color: var(--pen-red); }

/* ---------- גרפים ---------- */

.graphs { display: flex; gap: 8px; }
.graph-row { display: flex; align-items: flex-start; margin: 0 10px; overflow-x: auto; }
.rownums { background: var(--card); }
.rownums .daynum { display: flex; align-items: center; justify-content: center; }

.graph { flex: none; }
.graph-head {
  display: flex; flex-direction: column; justify-content: flex-end;
  border-bottom: 1.5px solid var(--ink); padding-bottom: 4px;
  position: sticky; top: 0; z-index: 3;
  background: var(--paper);
}
.graph-row .rownums, .left-inner .rownums { position: relative; }
.graph-title { font-size: 13px; }
.graph-title i { font-style: normal; font-size: 11px; color: var(--ink-soft); opacity: .8; }
.graph-axis {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 10px; color: var(--ink-soft); margin-top: 3px;
  box-sizing: border-box; width: 100%;
}
.graph-axis b { font-weight: 500; }

.graph-svg { display: block; background: var(--card); }
.tick { stroke: var(--rule); stroke-width: 1; }
.tick.major { stroke: var(--rule-strong); }
.tick.row { stroke: var(--rule); opacity: .55; }
.line { fill: none; stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; }

.missing {
  margin: 12px 10px;
  padding: 8px 10px;
  border-inline-start: 3px solid var(--pen-red);
  background: rgba(179, 39, 30, .07);
  font-size: 13px; border-radius: 3px;
}

/* ---------- סיכום ---------- */

.summary { margin: 24px 10px 40px; }
.band {
  background: var(--band); color: var(--band-text);
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 7px 14px; border-radius: 3px;
}
.band h3 { margin: 0; font-size: 15px; font-weight: 500; }
.band span { font-size: 12px; opacity: .7; }

.summary-body { display: flex; gap: 20px; align-items: flex-start; padding: 16px 4px 0; flex-wrap: wrap; }
.overall { text-align: center; flex: none; width: 150px; margin: 0 auto; }
.overall p { margin: 8px 0 0; font-size: 12px; color: var(--ink-soft); line-height: 1.4; }

.rings {
  flex: 1; min-width: 0;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 14px 6px;
}
.ring-cell { text-align: center; }
.ring-cell b { display: block; font-size: 12.5px; font-weight: 500; margin-top: 4px; }
.ring-cell i { display: block; font-style: normal; font-size: 11px; color: var(--ink-soft); }

.ring { display: block; margin: 0 auto; }
.ring-track { fill: none; stroke: var(--rule); }
.ring-fill { fill: none; stroke-linecap: round; }
.ring-text { text-anchor: middle; dominant-baseline: central; font-size: 15px; font-weight: 500; fill: var(--ink); }

/* ---------- מחברת (מסך רחב) ---------- */

.desk { padding: 22px 20px 60px; }
.spread {
  display: flex; max-width: 1500px; margin: 0 auto;
  border-radius: 6px; overflow: hidden; background: var(--card);
  box-shadow: 0 14px 34px rgba(23, 33, 43, .14);
}
.page { padding: 20px 22px 24px; }
.page-right { flex: 1 1 46%; }
.page-left { flex: 1 1 54%; display: flex; flex-direction: column; position: relative; }
.gutter {
  width: 24px; flex: 0 0 24px;
  background:
    linear-gradient(90deg, rgba(23,33,43,.13), rgba(23,33,43,0) 45%),
    linear-gradient(270deg, rgba(23,33,43,.13), rgba(23,33,43,0) 45%),
    var(--card);
}
.page-head { display: flex; flex-direction: column; justify-content: space-between; }
.page-kicker {
  margin: 0 0 8px; font-size: 13px; color: var(--ink-soft);
  border-bottom: 1.5px solid var(--ink); padding-bottom: 6px;
}
.left-inner { display: flex; gap: 10px; align-items: flex-start; }
.desk .moments, .desk .grid { margin: 0; border: none; }
.desk .grid { border-inline-start: 1px solid var(--rule-strong); }
.desk .summary { margin: 22px 0 0; }
.desk .nextmonth { margin-inline: 0; }

/* ---------- מגירת התפריט ---------- */

.drawer-wrap { position: fixed; inset: 0; background: rgba(12, 17, 22, .45); z-index: 30; display: flex; }
.drawer {
  width: min(340px, 88vw);
  margin-inline-end: auto;
  background: var(--paper);
  height: 100%;
  overflow-y: auto;
  padding: 14px 16px calc(30px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column;
  box-shadow: 6px 0 24px rgba(12, 17, 22, .25);
}
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; }
.section { border-top: 1px solid var(--rule); }
.section:last-of-type { border-bottom: 1px solid var(--rule); }
.section-head {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  background: none; border: none; padding: 14px 2px; font-size: 15px; color: var(--ink);
}
.section-head .chev {
  font-style: normal; font-size: 15px; color: var(--ink-soft);
  transition: transform .18s ease;
}
.section.open .section-head .chev { transform: rotate(180deg); }
.section-body { padding: 0 2px 16px; }

.toggle { display: flex; border: 1px solid var(--rule-strong); border-radius: var(--radius); overflow: hidden; }
.toggle button { flex: 1; background: var(--card); border: none; padding: 10px; color: var(--ink-soft); }
.toggle button.on { background: var(--band); color: var(--band-text); }

/* ---------- חלון יום ---------- */

.sheet-wrap { position: fixed; inset: 0; background: rgba(12, 17, 22, .4); display: flex; align-items: flex-end; z-index: 40; }
.sheet {
  width: 100%; max-height: 88vh; overflow-y: auto;
  background: var(--paper); border-radius: 12px 12px 0 0;
  padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sheet-head h3 { margin: 0; font-size: 17px; font-weight: 500; }
.sheet-nav { display: flex; align-items: center; gap: 2px; }
.two { display: flex; gap: 12px; }
.two .field { flex: 1; }
.sheet-habits { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--rule-strong); background: var(--card);
  border-radius: 20px; padding: 8px 13px; font-size: 14px;
}
.chip.on { border-color: var(--pen); background: var(--tint); }
.chip .x { width: 15px; height: 15px; }
.chip .dot { width: 13px; height: 13px; border: 1px solid var(--rule-strong); border-radius: 50%; }

/* ---------- עורך נושאים ---------- */

.editor h3 { margin: 0 0 6px; font-size: 16px; font-weight: 500; }
.hint { margin: 0 0 14px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
.hint.note { color: var(--pen-red); }
.editor-list { list-style: none; margin: 0 0 14px; padding: 0; }
.editor-list li { display: flex; align-items: center; gap: 2px; border-bottom: 1px solid var(--rule); }
.editor-list input {
  flex: 1; min-width: 0; border: none; background: transparent;
  padding: 9px 4px; font-size: 15px;
}
.editor-list input:focus { outline: none; background: var(--tint); }
.editor-add { display: flex; gap: 8px; }
.editor-add input {
  flex: 1; min-width: 0; border: 1px solid var(--rule-strong);
  border-radius: var(--radius); padding: 9px 11px; background: var(--card);
}

.credit {
  margin: 18px 0 0;
  text-align: center;
  font-size: 11.5px;
  letter-spacing: .03em;
  color: var(--ink-soft);
  opacity: .75;
}

/* מקטעים חשופים בתוך המגירה */
.summary.bare { margin: 0; }
.summary.bare .summary-body { padding: 0; gap: 14px; }
.summary.bare .overall { width: 100%; }
.nextmonth.bare { margin: 0; border-top: none; padding-top: 0; }
.nextmonth.bare label { flex-direction: column; align-items: stretch; gap: 6px; }
.nextmonth.bare input { border: 1px solid var(--rule-strong); border-radius: var(--radius); padding: 9px 11px; }
.section .editor h3 { display: none; }
.section .credit { margin-top: 12px; }

/* כפתור הזנה מהירה */
.add-btn {
  flex: none;
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border: 1px solid var(--rule-strong);
  background: var(--card);
  color: var(--ink);
  border-radius: 50%;
}
.add-btn:active { background: var(--tint); }
.page-left > .add-btn { position: absolute; top: 16px; right: 22px; z-index: 2; }

.chev-ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.monthnav .ghost { display: flex; align-items: center; padding: 6px; }

.month-select {
  width: 100%; margin-bottom: 14px;
  border: 1px solid var(--rule-strong); border-radius: var(--radius);
  background: var(--card); color: var(--ink); padding: 9px 11px;
}
.browser .summary.bare { margin-top: 4px; }

/* דיאלוג אישור */
.confirm-wrap {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(12, 17, 22, .5);
  display: grid; place-items: center; padding: 24px;
}
.confirm {
  width: min(340px, 100%);
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 18px 44px rgba(12, 17, 22, .3);
}
.confirm h3 { margin: 0 0 8px; font-size: 17px; font-weight: 500; }
.confirm p { margin: 0 0 18px; font-size: 13.5px; line-height: 1.55; color: var(--ink-soft); }
.confirm-actions { display: flex; gap: 8px; }
.confirm-actions .btn { flex: 1; justify-content: center; width: auto; }
.btn.primary.danger { background: var(--pen-red); border-color: var(--pen-red); color: #fff; }

.row-weekend { fill: var(--tint); }
.row-today { fill: none; stroke: rgba(179, 39, 30, .4); stroke-width: 1.5; }

/* שחזור סיסמה */
.linky {
  display: block; width: 100%; margin-top: 12px;
  background: none; border: none; color: var(--ink-soft);
  font-size: 13px; text-decoration: underline; text-underline-offset: 3px;
}
.login-note { color: var(--pen-green); font-size: 13px; line-height: 1.5; margin: 0 0 14px; }

/* נקודת התראה על כפתור ההזנה */
.add-btn { position: relative; }
.add-btn .badge {
  position: absolute; top: -2px; left: -2px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--pen-red); border: 2px solid var(--paper);
}

/* תובנות */
.insights {
  list-style: none; margin: 18px 0 0; padding: 14px 0 0;
  border-top: 1px solid var(--rule);
}
.insights li {
  font-size: 13px; line-height: 1.6; color: var(--ink-soft);
  padding-inline-start: 14px; position: relative; margin-bottom: 6px;
}
.insights li::before {
  content: ""; position: absolute; inset-inline-start: 0; top: 9px;
  width: 5px; height: 5px; border-radius: 50%; background: var(--pen);
}
